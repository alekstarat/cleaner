# cleaner.conf — one pattern per line, similar to .gitignore.
# Empty lines and lines beginning with # are ignored.
#
# Patterns without "/" match file/directory names at any depth.
# Patterns containing "/" are matched against paths relative to project root.
# A trailing "/" means directories only.
# Be careful: matching directories are deleted recursively.

# Python
__pycache__/
*.py[cod]
*$py.class
.pytest_cache/
.mypy_cache/
.ruff_cache/
.tox/

# Common tool caches
.cache/
.nox/
.coverage
.coverage.*
htmlcov/

# Build artifacts
*.egg-info/
build/
dist/

# Uncomment if you explicitly want to remove local environments:
.venv/
venv/
env/
